name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Platform 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Instalar Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Testes unitários do domínio
        run: gradle :domain:test --stacktrace

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTime-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK para download no celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ScreenTime-debug.apk
          gh release delete build-latest --yes --cleanup-tag || true
          gh release create build-latest ScreenTime-debug.apk \
            --target "$GITHUB_SHA" \
            --title "ScreenTime: último build" \
            --notes "Gerado automaticamente a partir do commit ${GITHUB_SHA::7}."
